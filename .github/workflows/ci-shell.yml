      - name: Checkout
        uses: actions/checkout@v4
      - name: Bash syntax check
        shell: bash
        timeout-minutes: 5
        run: find . -name '*.sh' -type f -not -path './.git/*' | xargs -I{} bash -n {}
      - name: ShellCheck
        shell: bash
        timeout-minutes: 5
        run: find . -name '*.sh' -type f -not -path './.git/*' | xargs shellcheck --severity=warning
      - name: Shell formatting (shfmt)
        shell: bash
        continue-on-error: true
