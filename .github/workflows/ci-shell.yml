                  }
              },
              'components': packages
          }

          with open('sbom.cdx.json', 'w') as out:
              json.dump(sbom, out, indent=2)
          print(f'SBOM generated: {len(packages)} components')
          "
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
