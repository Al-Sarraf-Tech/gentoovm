        uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM
        shell: bash
        timeout-minutes: 5
        run: |
          echo "Generating SBOM from manifests/installed-packages.txt..."
          python3 -c "
          import json

          packages = []
          with open('manifests/installed-packages.txt') as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  parts = line.rsplit('-', 1)
                  if len(parts) == 2:
                      name, version = parts
                  else:
                      name, version = line, 'unknown'
                  packages.append({
                      'type': 'library',
                      'name': name,
                      'version': version,
                      'purl': f'pkg:gentoo/{name}@{version}'
                  })

          sbom = {
              'bomFormat': 'CycloneDX',
              'specVersion': '1.4',
              'version': 1,
              'metadata': {
                  'component': {
                      'type': 'operating-system',
                      'name': 'gentoovm',
