  security:
    name: Security
    runs-on: [self-hosted, shell-slim]
    needs: [repo-guard]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Secrets scan (gitleaks)
        shell: bash
        timeout-minutes: 10
