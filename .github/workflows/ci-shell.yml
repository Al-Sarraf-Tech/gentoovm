        uses: actions/checkout@v4
      - name: Prepare release assets
        shell: bash
        timeout-minutes: 5
        run: |
          mkdir -p release-assets
          cp iso/gentoovm.iso.sha256 release-assets/
          cp iso/gentoovm.iso.md5 release-assets/
          cp iso/reassemble.sh release-assets/
          cp iso/reassemble.ps1 release-assets/
          cp iso/MAGNET_LINK.txt release-assets/
          cp iso/*.torrent release-assets/ 2>/dev/null || true
          cp iso/gentoovm.iso.part.* release-assets/ 2>/dev/null || true
          python3 -c "
          import json
          packages = []
          with open('manifests/installed-packages.txt') as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'): continue
                  parts = line.rsplit('-', 1)
                  name, version = (parts[0], parts[1]) if len(parts) == 2 else (line, 'unknown')
                  packages.append({'type':'library','name':name,'version':version,'purl':f'pkg:gentoo/{name}@{version}'})
          sbom = {'bomFormat':'CycloneDX','specVersion':'1.4','version':1,
                  'metadata':{'component':{'type':'operating-system','name':'gentoovm'}},
                  'components':packages}
          with open('release-assets/sbom.cdx.json','w') as out:
              json.dump(sbom,out,indent=2)
          print(f'{len(packages)} components')
          "
          cd release-assets && sha256sum * > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
